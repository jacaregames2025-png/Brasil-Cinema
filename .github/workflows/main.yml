name: Criar APK Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Configurar o Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar o Expo CLI e EAS
        run: npm install -g expo-cli eas-cli

      - name: Compilar o APK (Gradle)
        run: |
          npm install --force
          npx expo-modules-autolinking generate-configuration android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Guardar o APK Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/release/app-release.apk
