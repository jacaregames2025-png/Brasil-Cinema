name: Criar APK Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar o Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Instalar Dependencias do Projeto
        run: |
          npm install --legacy-peer-deps

      - name: Preparar Projeto Android
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew help

      - name: Compilar o APK de Release
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Guardar o APK Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
