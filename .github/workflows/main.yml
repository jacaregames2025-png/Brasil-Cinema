name: Criar APK Launcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar o Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Dependencias e Gerar Pasta Android
        run: |
          npm install --legacy-peer-deps
          npx expo prebuild --platform android --clean

      - name: Compilar o APK (Gradle)
        run: |
          # Varre absolutamente todas as pastas e remove o jcenter desativado da biblioteca antiga
          find . -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          
          # Injeta repositorios atualizados no build.gradle principal do Android
          sed -i '/allprojects {/a \    repositories { mavenCentral(); maven { url "https://google.com" } }' android/build.gradle
          
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Guardar o APK Pronto para Download
        uses: actions/upload-artifact@v4
        with:
          name: meu-aplicativo-apk
          path: android/app/build/outputs/apk/release/app-release.apk
