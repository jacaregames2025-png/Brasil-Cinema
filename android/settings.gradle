pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PRESERVE_EXISTING)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'TouchMobile'

def nativeModulesGradle = file('../node_modules/@react-native-community/cli-platform-android/native_modules.gradle')
if (nativeModulesGradle.exists()) {
    apply from: nativeModulesGradle
    applyNativeModulesSettingsGradle(settings)
}

include ':app'

if (file('../node_modules/react-native-gradle-plugin').exists()) {
    includeBuild('../node_modules/react-native-gradle-plugin')
}

if (settings.hasProperty('newArchEnabled') && settings.newArchEnabled == 'true') {
    include ':ReactAndroid'
    project(':ReactAndroid').projectDir = file('../node_modules/react-native/ReactAndroid')

    include ':ReactAndroid:hermes-engine'
    project(':ReactAndroid:hermes-engine').projectDir = file('../node_modules/react-native/ReactAndroid/hermes-engine')
}

include ':react-native-fs'
project(':react-native-fs').projectDir = new File(settingsDir, '../node_modules/react-native-fs/android')

include ':react-native-gpu-info'
project(':react-native-gpu-info').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-gpu-info/android')
